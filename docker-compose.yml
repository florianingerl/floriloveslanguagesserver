# Backend und MongoDB. Gleiche Datei lokal und auf dem Server.
#
#   docker compose up -d --build
#   docker compose exec backend node dist/seed.js
#   docker compose logs -f backend

services:
  mongo:
    image: mongo:7
    container_name: florian-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build: .
    container_name: florian-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://mongo:27017/test
      PORT: 8080
      RACKET_API_KEY: ${RACKET_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      RESEND_API_URL: ${RESEND_API_URL:-}
      RESEND_TIMEOUT_MS: ${RESEND_TIMEOUT_MS:-}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OAUTH_ALLOWED_REDIRECT_ORIGINS: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:-}
    mem_limit: 256m
    networks:
      - default
      - proxy

volumes:
  mongo-data:

networks:
  proxy:
    external: true
    name: chrome-stack_default
