# Reverse-Proxy, der der Express-API TLS (HTTPS) gibt. Nötig, damit die auf
# GitHub Pages gehostete (HTTPS) Website den Server ansprechen darf: Browser
# blockieren requests von einer HTTPS-Seite an ein HTTP-Ziel ("mixed content").
#
# Die API selbst bleibt unverändert auf http://127.0.0.1:8080; nginx nimmt
# auf Port 80/443 entgegen, leitet an 8080 weiter und übernimmt das
# Let's-Encrypt-Zertifikat (automatische Erneuerung).
#
# Einmalige Einrichtung auf dem Server (als root):
#
#   ufw allow 80/tcp
#   ufw allow 443/tcp
#   apt-get update
#   apt-get install -y certbot python3-certbot-nginx
#   cp https-proxy.conf /etc/nginx/sites-available/https-proxy
#   ln -sf /etc/nginx/sites-available/https-proxy /etc/nginx/sites-enabled/https-proxy
#   certbot --nginx -d florian-api.82.165.94.44.sslip.io
#   nginx -t && systemctl reload nginx
#
# Danach antwortet die API auch unter
#   https://florian-api.82.165.94.44.sslip.io/amen
# und das Frontend (.env.production) zeigt bereits auf diese Adresse.

server {
    listen 80;
    listen [::]:80;
    server_name florian-api.82.165.94.44.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}